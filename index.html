<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Senior Housing News Daily Briefings</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <div class="header-brand">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
          <polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        <div>
          <h1>Senior Housing News</h1>
          <span class="header-subtitle">Daily Industry Briefings</span>
        </div>
      </div>
      <div class="header-meta" id="header-meta">
        <span class="briefing-count" id="briefing-count">Loading...</span>
      </div>
    </div>
  </header>

  <div class="app-layout">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

      <div class="sidebar-search">
        <label class="sidebar-section-label">Search Briefings</label>
        <div class="search-input-wrap">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
          </svg>
          <input type="text" id="search-input" placeholder="Search by keyword..." autocomplete="off" />
          <button class="search-clear" id="search-clear" title="Clear search" aria-label="Clear search">&times;</button>
        </div>
      </div>

      <div class="sidebar-filters">
        <div class="filters-header">
          <label class="sidebar-section-label">Filters</label>
          <button class="clear-filters-btn" id="clear-filters-btn">Clear all</button>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="filter-year">Year</label>
          <select id="filter-year">
            <option value="">All Years</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="filter-month">Month</label>
          <select id="filter-month">
            <option value="">All Months</option>
            <option value="01">January</option>
            <option value="02">February</option>
            <option value="03">March</option>
            <option value="04">April</option>
            <option value="05">May</option>
            <option value="06">June</option>
            <option value="07">July</option>
            <option value="08">August</option>
            <option value="09">September</option>
            <option value="10">October</option>
            <option value="11">November</option>
            <option value="12">December</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="filter-category">Category</label>
          <select id="filter-category">
            <option value="">All Categories</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="filter-source">Source</label>
          <select id="filter-source">
            <option value="">All Sources</option>
          </select>
        </div>

        <div class="filter-group">
          <label class="filter-label" for="filter-company">Company</label>
          <select id="filter-company">
            <option value="">All Companies</option>
          </select>
        </div>
      </div>

      <div class="sidebar-list-section">
        <div class="sidebar-list-header">
          <label class="sidebar-section-label">Briefings</label>
          <span class="results-count" id="results-count"></span>
        </div>
        <ul class="briefings-list" id="briefings-list">
          <li class="list-loading">Loading briefings...</li>
        </ul>
      </div>

    </aside>

    <!-- Main content -->
    <main class="main-content" id="main-content">
      <div class="content-loading" id="content-loading">
        <div class="spinner"></div>
        <p>Loading briefing...</p>
      </div>
      <div class="briefing-container" id="briefing-container" style="display:none;">
        <div class="briefing-header-bar">
          <div class="briefing-date-badge" id="briefing-date-badge"></div>
          <div class="briefing-tags" id="briefing-tags"></div>
        </div>
        <div class="briefing-body" id="briefing-body"></div>
      </div>
      <div class="empty-state" id="empty-state" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        <h3>No briefings found</h3>
        <p>Try adjusting your filters or search query.</p>
        <button class="btn-reset" id="btn-reset-empty">Reset filters</button>
      </div>
    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
